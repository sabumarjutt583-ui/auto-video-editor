name: Windows installer

# Builds the Windows installers (.exe and .msi) on GitHub's own computers.
# Run it by hand: Actions tab -> "Windows installer" -> Run workflow.
# The files appear at the bottom of the finished run, under "Artifacts".
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install packages
        run: npm ci

      - name: Download FFmpeg (LGPL build for Windows)
        run: npm run setup:ffmpeg

      - name: Build installers (signed updates, when a signing key secret exists)
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: npx tauri build

      - name: Build installers (no signing key yet, so no update files)
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY == '' }}
        run: npx tauri build --config src-tauri/tauri.nosign.conf.json

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: auto-video-editor-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
