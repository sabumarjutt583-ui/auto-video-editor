name: Installers

# Builds the installers on GitHub's own computers and puts them straight on the
# "Releases" page of this repository (no zip files):
#   Windows -> .exe        Linux -> .AppImage and .deb
# Each system uploads its own file as soon as it is built, so Windows does not
# wait for Linux.
# Run it by hand: Actions tab -> "Installers" -> Run workflow (type a version like v0.1.0).
# Or push a tag that starts with v (for example v0.1.1).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release name, for example v0.1.0"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Create the release
    runs-on: ubuntu-22.04
    steps:
      - name: Create the release page (if it does not exist yet)
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "Auto Video Editor $TAG" \
              --notes "Windows: the .exe installer. Linux: the .AppImage (any distro) or the .deb (Ubuntu/Debian). Not signed yet: Windows may show a blue SmartScreen warning (More info, Run anyway)."
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            upload: "src-tauri/target/release/bundle/nsis/*.exe"
          - os: ubuntu-22.04
            bundles: appimage,deb
            upload: "src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install packages
        run: npm ci

      - name: Download FFmpeg (LGPL build for this system)
        run: npm run setup:ffmpeg

      - name: Build installers (signed updates, when a signing key secret exists)
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Build installers (no signing key yet, so no update files)
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY == '' }}
        run: npx tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.nosign.conf.json

      - name: Put the installer files on the Releases page
        shell: bash
        run: gh release upload "$TAG" ${{ matrix.upload }} --clobber
