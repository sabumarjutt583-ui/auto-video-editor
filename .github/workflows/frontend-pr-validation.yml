name: Frontend PR validation

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, feature/script-writer-core-v1, feature/script-writer-integration-v1, feature/script-writer-comparison-v1, feature/script-writer-desktop-readiness-v1, feature/script-writer-durable-store-v1, feature/script-writer-state-machine-v1, feature/script-writer-manual-import-v1, feature/script-writer-review-approval-v1, feature/script-writer-revisions-v1, feature/script-writer-recovery-v1, feature/script-writer-channel-studio-v1, feature/script-writer-multipart-execution-v1]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  frontend:
    name: Typecheck, TypeScript tests and Vite build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npx tsc -b
      - name: TypeScript test suite
        run: npm run test:ts
      - name: Frontend production build
        run: npm run build

  windows-frontend:
    name: Windows frontend typecheck, tests and build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npx tsc -b
      - name: TypeScript test suite
        run: npm run test:ts
      - name: Frontend production build
        run: npm run build

  rust-linux:
    name: Linux Rust job-store tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - name: Install real Ubuntu FFmpeg test executable (CI only; never packaged)
        run: |
          mkdir -p src-tauri/binaries
          cp "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu -version | head -n 1
      - name: Run job store tests with locked Rust dependencies
        working-directory: src-tauri
        run: cargo test --locked script_jobs && cargo test --locked script_studio && cargo test --locked script_execution && cargo test --locked script_review
      - name: Build Rust desktop backend
        working-directory: src-tauri
        run: cargo build --locked
      - name: Verify admin Rust compilation
        working-directory: src-tauri
        run: cargo check --locked --features admin

      - name: Re-run previously failing media audio render and timing tests with real FFmpeg
        working-directory: src-tauri
        env:
          AVE_TEST_FFMPEG: ${{ github.workspace }}/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          AVE_REQUIRE_SIDECAR: "1"
        run: |
          cargo test --locked ffmpeg_job::tests
          cargo test --locked audio::mix::tests
          cargo test --locked render::pipeline::tests
          cargo test --locked timing::tests
      - name: Full unfiltered Rust suite using real FFmpeg (failure is blocking)
        working-directory: src-tauri
        env:
          AVE_TEST_FFMPEG: ${{ github.workspace }}/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          AVE_REQUIRE_SIDECAR: "1"
        run: cargo test --locked

  rust-windows:
    name: Windows Rust job-store tests and build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Provide compile-only Tauri sidecar placeholder (never executed)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path src-tauri/binaries -Force | Out-Null
          New-Item -ItemType File -Path src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -Force | Out-Null
      - name: Run Windows job store filesystem tests
        working-directory: src-tauri
        run: cargo test --locked script_jobs && cargo test --locked script_studio && cargo test --locked script_execution && cargo test --locked script_review
      - name: Build Windows Rust desktop backend
        working-directory: src-tauri
        run: cargo build --locked
      - name: Verify Windows admin Rust compilation
        working-directory: src-tauri
        run: cargo check --locked --features admin
