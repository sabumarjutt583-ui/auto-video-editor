[package]
name = "auto-video-editor"
version = "0.7.0"
description = "Auto Video Editor: prompt generator and automatic video editor for faceless YouTube creators"
edition = "2021"
rust-version = "1.77"

[features]
# The Admin Edition (sound library tools). Never enabled for the user installer.
admin = []

# Small and fast release build. panic = "abort" means a bug stops the app at once (the panic hook writes the log first).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "macros", "io-util", "rt", "net"] }
keyring = "4"
# native-tls = Windows Schannel / macOS Secure Transport, so no extra C toolchain is needed to build.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "http2", "system-proxy"] }
# Direct Edge TTS calls only: a WebSocket client over the system's TLS
# (Windows Schannel / macOS Secure Transport, like reqwest above), so no
# extra C toolchain is needed. No git dependencies, pinned major versions.
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
trash = "5"

[dev-dependencies]
# Local mock server used by the API helper tests.
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
